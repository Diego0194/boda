<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Galería Tiras de Fotomatón</title>
    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --accent-color: #f43f5e;
            --text-color: #f8fafc;
        }

        * {
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            height: 100vh;
            height: 100dvh;
            overflow: hidden;
        }

        header {
            text-align: center;
            padding: 8px 16px;
            background: rgba(30, 41, 59, 0.85);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
            flex-shrink: 0;
        }

        h1 {
            margin: 0;
            font-size: 1.1rem;
            letter-spacing: 0.5px;
        }

        p.subtitle {
            margin: 2px 0 0;
            color: #94a3b8;
            font-size: 0.75rem;
        }

        .gallery-container {
            display: flex;
            align-items: center;
            overflow-x: auto;
            -webkit-overflow-scrolling: touch;
            gap: 20px;
            padding: 15px 25px;
            flex-grow: 1;
            cursor: grab;
            user-select: none;
            scroll-behavior: auto;
        }

        .gallery-container:active {
            cursor: grabbing;
        }

        .strip-card {
            flex: 0 0 auto;
            width: auto;
            height: 100%;
            background: var(--card-bg);
            border-radius: 12px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.5);
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
            border: 1px solid rgba(255, 255, 255, 0.08);
            padding: 6px;
            transition: border-color 0.2s ease, transform 0.1s ease;
            cursor: pointer;
            text-decoration: none;
        }

        .strip-card:hover {
            border-color: rgba(244, 63, 94, 0.5);
        }

        .strip-card:active {
            transform: scale(0.98);
        }

        .strip-image-wrapper {
            width: 100%;
            height: 100%;
            background: #060910;
            border-radius: 8px;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            pointer-events: none;
        }

        .strip-image-wrapper img {
            height: 100%;
            width: auto;
            object-fit: contain;
            -webkit-user-drag: none;
            user-drag: none;
            pointer-events: none;
        }

        .gallery-container::-webkit-scrollbar {
            display: none;
        }
        .gallery-container {
            -ms-overflow-style: none;
            scrollbar-width: none;
        }
    </style>
</head>
<body>

    <header>
        <h1>Galería de Tiras de Fotomatón</h1>
        <p class="subtitle">Desliza horizontalmente para moverte. Pulsa una tira para ver su carpeta.</p>
    </header>

    <div class="gallery-container" id="gallery"></div>

    <script>
        const FOLDER_MAP = {
            "01": "https://drive.google.com/drive/folders/1VaJgIMmNok9vWK3pbqqKhj_i19uvbv__",
            "02": "https://drive.google.com/drive/folders/1yvlTuqZ0-NC6EDZInXO_OxPYHzAWnOJL",
            "03": "https://drive.google.com/drive/folders/1ECqD40niHD18_IC3i7EBTQ--buOUynNE",

            "06": "https://drive.google.com/drive/folders/1o2UtiQy7sFScKFfF7zVoSJGAGagFZrfH",

            "09": "https://drive.google.com/drive/folders/15PxoWxn9BnJQF7q6cdZ9NdwwciHfmFNU",
            "10": "https://drive.google.com/drive/folders/1milnLk53IlzAq0zYKb7V69XY0WFP5xae",
            "11": "https://drive.google.com/drive/folders/1wsZa42iGy3YlUbED7Yr3idYqg4u-UXGT",

            "14": "https://drive.google.com/drive/folders/1-IR7ppN_xscej7tmtxE9GXtGWPnwu2t5",
            "15": "https://drive.google.com/drive/folders/1zKtGlSbsB__OthVh5A84xzPIoeoCzSPi",
            "16": "https://drive.google.com/drive/folders/1fZo0ZDIwl_06u7eDxjwxENKs4aJCe6zO",

            "21": "https://drive.google.com/drive/folders/139A1SriGOjSZw2osn8MMWSjmHr8SvKAJ",
            "22": "https://drive.google.com/drive/folders/1cIHwny6UCrLtPuf1gjRa2oMY1WwiHq1X",
            "23": "https://drive.google.com/drive/folders/1FKJFevQLvNs22S0v-OYer6wqW66snC-D",

            "27": "https://drive.google.com/drive/folders/1SpohA6CtnEvuHvxahSKFSNGm-eJVrTFc",
            "28": "https://drive.google.com/drive/folders/1u2xjrrwCRfSj67tKiS0OmPn6Gu_NnFF4",
            "29": "https://drive.google.com/drive/folders/1SdFnjW9iJg8YiQ-g23GeEHzPWkN6irbW",
            "30": "https://drive.google.com/drive/folders/1fOqZOUk5oLtCHAAefKuQQHGQRWV6wp91",
            "31": "https://drive.google.com/drive/folders/1sH0FXDE88CzM8pBsSy1YzqveAduHgLHX",
            "32": "https://drive.google.com/drive/folders/1qLg2Oi5afMCZ_zGEjKl9YNUwC5GOU5eP",
            "33": "https://drive.google.com/drive/folders/10xfbejqrZLP1lwy7acxKHZ9MJl4-vJ3f",
            "34": "https://drive.google.com/drive/folders/1hpftubD1m7b8Er0tecVS35F-W5mv9Ox5",
            "35": "https://drive.google.com/drive/folders/1aQJkBFct2emgX7wwd5VNYlRlPUKExiD-",
            "36": "https://drive.google.com/drive/folders/1nl0Kc4A230cdTwK2RANqaG66gqcXLT08",
            "37": "https://drive.google.com/drive/folders/1bw5ZvPR5BLbxLp2DG2XEVi6nTeb-odg2"
        };

        const TOTAL_STRIPS = 37;

        function initGallery() {
            const gallery = document.getElementById('gallery');

            for (let i = 1; i <= TOTAL_STRIPS; i++) {
                const numStr = String(i).padStart(2, '0');
                const imgPath = `fotomaton/${numStr}.jpg`;
                const folderUrl = FOLDER_MAP[numStr] || "#";

                const card = document.createElement('a');
                card.className = 'strip-card';
                card.id = `strip-${numStr}`;
                card.href = folderUrl;
                card.target = '_blank';
                card.rel = 'noopener noreferrer';

                card.addEventListener('click', (e) => {
                    if (card.dataset.hasMoved === "true" || card.getAttribute('href') === "#") {
                        e.preventDefault();
                    }
                });

                card.innerHTML = `
                    <div class="strip-image-wrapper">
                        <img src="${imgPath}" alt="Tira ${numStr}" draggable="false" loading="lazy">
                    </div>
                `;
                gallery.appendChild(card);
            }

            initSmoothDrag(gallery);
        }

        function initSmoothDrag(slider) {
            let isDown = false;
            let startX;
            let scrollLeft;

            // Desktop
            slider.addEventListener('mousedown', (e) => {
                isDown = true;
                slider.classList.add('active');
                startX = e.pageX - slider.offsetLeft;
                scrollLeft = slider.scrollLeft;
                slider.querySelectorAll('.strip-card').forEach(c => c.dataset.hasMoved = "false");
            });

            slider.addEventListener('mouseleave', () => {
                isDown = false;
                slider.classList.remove('active');
            });

            slider.addEventListener('mouseup', () => {
                isDown = false;
                slider.classList.remove('active');
            });

            slider.addEventListener('mousemove', (e) => {
                if (!isDown) return;
                const x = e.pageX - slider.offsetLeft;
                const walk = (x - startX) * 1.8;

                if (Math.abs(walk) > 4) {
                    slider.querySelectorAll('.strip-card').forEach(c => c.dataset.hasMoved = "true");
                }

                slider.scrollLeft = scrollLeft - walk;
            });

            // Móviles / Tablets
            slider.addEventListener('touchstart', (e) => {
                isDown = true;
                startX = e.touches[0].pageX - slider.offsetLeft;
                scrollLeft = slider.scrollLeft;
                slider.querySelectorAll('.strip-card').forEach(c => c.dataset.hasMoved = "false");
            }, { passive: true });

            slider.addEventListener('touchend', () => {
                isDown = false;
            });

            slider.addEventListener('touchmove', (e) => {
                if (!isDown) return;
                const x = e.touches[0].pageX - slider.offsetLeft;
                const walk = (x - startX) * 1.5;

                if (Math.abs(walk) > 5) {
                    slider.querySelectorAll('.strip-card').forEach(c => c.dataset.hasMoved = "true");
                }

                slider.scrollLeft = scrollLeft - walk;
            }, { passive: true });
        }

        initGallery();
    </script>
</body>
</html>
