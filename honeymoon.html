<!DOCTYPE html>
<html lang="es" class="h-full bg-stone-900">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Nuestra Luna de Miel 📸✨ | Álbum Polaroid</title>
  
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  
  <!-- Google Fonts: Caveat for handwriting, Plus Jakarta Sans for UI -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@500;600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  
  <!-- FontAwesome Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            handwriting: ['Caveat', 'cursive'],
            sans: ['Plus Jakarta Sans', 'sans-serif'],
          },
          colors: {
            polaroid: {
              paper: '#fcfbf9',
              shadow: 'rgba(0, 0, 0, 0.12)',
              accent: '#e07a5f',
            }
          }
        }
      }
    }
  </script>

  <style>
    /* Fondo con imagen personalizada repetida sin estirar */
    body {
      background-image: url('honeymoon/fondo.jpg');
      background-repeat: repeat;
      background-size: auto;
      background-position: top left;
    }

    .cork-texture {
      box-shadow: inset 0 0 120px rgba(0, 0, 0, 0.45);
    }

    /* Polaroid Card Styling */
    .polaroid-card {
      background: #fdfbf7;
      box-shadow: 0 12px 25px -5px rgba(0, 0, 0, 0.3), 0 8px 10px -6px rgba(0, 0, 0, 0.2);
      transition: all 0.35s cubic-bezier(0.25, 1, 0.5, 1);
      transform-origin: center top;
    }

    .polaroid-card:hover {
      transform: scale(1.04) rotate(0deg) !important;
      box-shadow: 0 20px 35px -8px rgba(0, 0, 0, 0.4);
      z-index: 30;
    }

    /* Chincheta (Push Pin Effect) */
    .pin {
      position: absolute;
      top: 6px;
      left: 50%;
      transform: translateX(-50%);
      width: 16px;
      height: 16px;
      background: radial-gradient(circle at 30% 30%, #ef4444, #991b1b);
      border-radius: 50%;
      box-shadow: 0 4px 6px rgba(0,0,0,0.4), inset -1px -1px 2px rgba(0,0,0,0.5);
      z-index: 20;
    }

    .pin::after {
      content: '';
      position: absolute;
      top: 3px;
      left: 3px;
      width: 4px;
      height: 4px;
      background: rgba(255, 255, 255, 0.8);
      border-radius: 50%;
    }

    /* Soft Polaroid Photo Frame Inner Glow */
    .photo-wrapper {
      box-shadow: inset 0 0 6px rgba(0,0,0,0.15);
    }

    /* Photo Developing Animation Effect */
    @keyframes photoDevelop {
      0% {
        filter: brightness(0.2) contrast(0.5) sepia(0.8) blur(4px);
        opacity: 0.2;
      }
      50% {
        filter: brightness(0.7) contrast(0.8) sepia(0.3) blur(1px);
        opacity: 0.8;
      }
      100% {
        filter: brightness(1) contrast(1) sepia(0) blur(0px);
        opacity: 1;
      }
    }

    .developing-animation {
      animation: photoDevelop 2.2s cubic-bezier(0.4, 0, 0.2, 1) forwards;
    }

    /* Custom Scrollbar */
    ::-webkit-scrollbar {
      width: 8px;
    }
    ::-webkit-scrollbar-track {
      background: rgba(0, 0, 0, 0.2);
    }
    ::-webkit-scrollbar-thumb {
      background: rgba(0, 0, 0, 0.4);
      border-radius: 4px;
    }
    ::-webkit-scrollbar-thumb:hover {
      background: rgba(0, 0, 0, 0.6);
    }
  </style>
</head>
<body class="font-sans min-h-full flex flex-col text-stone-800 cork-texture antialiased selection:bg-rose-200 selection:text-stone-900">

  <!-- Top Banner / Header -->
  <header class="sticky top-0 z-40 bg-stone-900/85 backdrop-blur-md border-b border-stone-700/50 shadow-lg text-white">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-3.5 flex flex-wrap items-center justify-between gap-4">
      
      <!-- Title & Subtitle -->
      <div class="flex items-center gap-3">
        <div class="w-10 h-10 rounded-full bg-rose-500/20 border border-rose-500/30 flex items-center justify-center text-rose-400 shadow-inner">
          <i class="fa-solid font-bold text-xl fa-heart"></i>
        </div>
        <div>
          <h1 class="text-2xl font-bold tracking-tight text-amber-100 flex items-center gap-2">
            Nuestra Luna de Miel <span class="text-rose-400 font-handwriting text-3xl font-normal">📸✨</span>
          </h1>
          <p class="text-xs text-amber-200/70 font-medium">Recuerdos inolvidables guardados en el tablón</p>
        </div>
      </div>

    </div>
  </header>

  <main class="flex-grow max-w-7xl w-full mx-auto px-4 sm:px-6 lg:px-8 py-8 flex flex-col gap-8">
    
    <!-- Controls Bar: Search Box & Counter -->
    <section class="bg-stone-900/60 backdrop-blur border border-stone-700/50 rounded-2xl p-4 shadow-xl flex flex-col sm:flex-row items-center justify-between gap-4">
      
      <!-- Search Box -->
      <div class="relative w-full sm:w-80">
        <i class="fa-solid fa-magnifying-glass absolute left-3.5 top-1/2 -translate-y-1/2 text-stone-400 text-sm"></i>
        <input type="text" id="input-search" placeholder="Buscar por lugar, nota o fecha..." class="w-full pl-10 pr-4 py-2 text-sm bg-stone-950/70 text-amber-100 placeholder-stone-400 border border-stone-700 rounded-xl focus:outline-none focus:ring-2 focus:ring-rose-500/50 focus:border-rose-500 transition">
      </div>

      <!-- Counter -->
      <div class="text-xs font-semibold text-amber-100 whitespace-nowrap bg-stone-950/70 border border-stone-700 px-3 py-1.5 rounded-lg">
        <span id="photo-counter">0</span> Fotografías
      </div>
    </section>

    <!-- Polaroid Gallery Grid -->
    <section id="gallery-grid" class="grid grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-4 sm:gap-8 lg:gap-10 py-4 items-start min-h-[350px]">
      <!-- Polaroid Items dynamically rendered here -->
    </section>

  </main>

  <!-- Modal: Lightbox / Enlarged View -->
  <div id="modal-lightbox" class="fixed inset-0 bg-stone-950/85 backdrop-blur-md z-50 flex items-center justify-center p-4 sm:p-8 opacity-0 pointer-events-none transition-all duration-300">
    
    <!-- Close Button -->
    <button id="btn-close-lightbox" class="absolute top-5 right-5 text-white/80 hover:text-white bg-white/10 hover:bg-white/20 rounded-full w-12 h-12 flex items-center justify-center transition z-10 text-xl backdrop-blur">
      <i class="fa-solid fa-xmark"></i>
    </button>

    <!-- Navigation Arrows -->
    <button id="btn-prev-lightbox" class="absolute left-4 top-1/2 -translate-y-1/2 text-white/80 hover:text-white bg-white/10 hover:bg-white/20 rounded-full w-12 h-12 flex items-center justify-center transition z-10 text-xl backdrop-blur">
      <i class="fa-solid fa-chevron-left"></i>
    </button>
    <button id="btn-next-lightbox" class="absolute right-4 top-1/2 -translate-y-1/2 text-white/80 hover:text-white bg-white/10 hover:bg-white/20 rounded-full w-12 h-12 flex items-center justify-center transition z-10 text-xl backdrop-blur">
      <i class="fa-solid fa-chevron-right"></i>
    </button>

    <!-- Giant Polaroid Frame Card -->
    <div id="lightbox-card" class="relative bg-amber-50/95 w-full rounded-lg shadow-2xl p-5 sm:p-8 pt-8 flex flex-col items-center transform scale-95 transition-all duration-300 modal-lightbox-card border border-stone-200">
      
      <!-- Chincheta para la vista ampliada -->
      <div class="pin !w-6 !h-6 !-top-3"></div>

      <!-- Photo Holder -->
      <div id="lightbox-wrapper" class="relative w-full max-h-[65vh] bg-stone-900 rounded shadow-inner overflow-hidden photo-wrapper flex items-center justify-center mt-2 transition-all duration-300">
        <img id="lightbox-img" class="w-full h-full object-contain">
      </div>

      <!-- Caption & Metadata Area -->
      <div class="w-full pt-6 pb-2 text-center flex flex-col items-center">
        <p id="lightbox-caption" class="font-handwriting text-3xl sm:text-4xl text-stone-900 font-bold px-4 leading-tight mb-2">
          <!-- Caption -->
        </p>
        <div class="flex items-center gap-3 text-xs font-medium text-stone-500">
          <span id="lightbox-location" class="flex items-center gap-1 bg-stone-200/60 px-2.5 py-1 rounded-full"><i class="fa-solid fa-location-dot text-rose-500"></i> <span></span></span>
          <span id="lightbox-date" class="flex items-center gap-1 bg-stone-200/60 px-2.5 py-1 rounded-full"><i class="fa-regular fa-calendar"></i> <span></span></span>
        </div>
      </div>

    </div>
  </div>

  <script>
    const SAMPLE_PHOTOS = [
      {
        id: 'photo-1',
        url: 'honeymoon/foto1.jpg',
        caption: 'Primera noche ☂️',
        location: 'Omoide Yokocho, Tokyo',
        date: '2026-09-09',
        rotation: -2.5
      },
      {
        id: 'photo-2',
        url: 'honeymoon/foto2.jpg',
        caption: 'Volviendo a la infancia',
        location: 'Fan Fun Street, Tokyo',
        date: '2026-09-10',
        rotation: 1.8
      },
      {
        id: 'photo-3',
        url: 'honeymoon/foto3.jpg',
        caption: 'Pagodeando',
        location: 'Templo Senso-ji, Tokyo',
        date: '2026-09-10',
        rotation: 2.2
      },
      {
        id: 'photo-4',
        url: 'honeymoon/foto4.jpg',
        caption: '¿Me lo puedo llevar?',
        location: 'Pokémon Center Skytree, Tokyo',
        date: '2026-09-10',
        rotation: -1.2
      },
      {
        id: 'photo-5',
        url: 'honeymoon/foto5.jpg',
        caption: 'Ñaaam',
        location: 'Kukurihime Coffee, Tokyo',
        date: '2026-09-10',
        rotation: -0.7
      },
      {
        id: 'photo-6',
        url: 'honeymoon/foto6.jpg',
        caption: '💍',
        location: 'Tanuki Street, Tokyo',
        date: '2026-09-10',
        rotation: 1.1
      },
      {
        id: 'photo-7',
        url: 'honeymoon/foto7.jpg',
        caption: 'Fast&Furious',
        location: 'Shinjuku, Tokyo',
        date: '2026-09-10',
        rotation: -1.4
      },
      {
        id: 'photo-8',
        url: 'honeymoon/foto8.jpg',
        caption: '✊🏼',
        location: 'Templo Gotokuji, Tokyo',
        date: '2026-09-11',
        rotation: 0.5
      },
      {
        id: 'photo-9',
        url: 'honeymoon/foto9.jpg',
        caption: '¡Selfie!',
        location: 'Santuario Meiji, Tokyo',
        date: '2026-09-11',
        rotation: -0.9
      },
      {
        id: 'photo-10',
        url: 'honeymoon/foto10.jpg',
        caption: 'Poquita gente...',
        location: 'Cruce de Shibuya, Tokyo',
        date: '2026-09-11',
        rotation: -0.7
      },
      {
        id: 'photo-11',
        url: 'honeymoon/foto11.png',
        caption: 'Desayuno 🥐',
        location: 'Age 3, Tokyo',
        date: '2026-09-12',
        rotation: 1.7
      },
      {
        id: 'photo-12',
        url: 'honeymoon/foto12.jpg',
        caption: '🏯',
        location: 'Kōkio, Tokyo',
        date: '2026-09-12',
        rotation: -0.4
      },
      {
        id: 'photo-13',
        url: 'honeymoon/foto13.jpg',
        caption: '¿La Torre Eiffel?',
        location: 'Torre de Tokyo',
        date: '2026-09-12',
        rotation: 0.7
      }
    ];

    let currentSearchTerm = '';
    let currentLightboxIndex = -1;
    let filteredPhotos = [];

    // DOM Elements
    const galleryGrid = document.getElementById('gallery-grid');
    const photoCounter = document.getElementById('photo-counter');
    const inputSearch = document.getElementById('input-search');

    // Modal Lightbox
    const modalLightbox = document.getElementById('modal-lightbox');
    const lightboxCard = document.getElementById('lightbox-card');
    const lightboxWrapper = document.getElementById('lightbox-wrapper');
    const lightboxImg = document.getElementById('lightbox-img');

    window.addEventListener('DOMContentLoaded', () => {
      setupEventListeners();
      renderGallery();
    });

    function getRandomRotation() {
      return (Math.random() * 6 - 3).toFixed(1);
    }

    function renderGallery() {
      filteredPhotos = SAMPLE_PHOTOS.filter(p => {
        const term = currentSearchTerm.toLowerCase();
        return !term || 
          (p.caption && p.caption.toLowerCase().includes(term)) || 
          (p.location && p.location.toLowerCase().includes(term)) ||
          (p.date && p.date.includes(term));
      });

      filteredPhotos.sort((a, b) => new Date(a.date || '9999-12-31') - new Date(b.date || '9999-12-31'));

      photoCounter.textContent = filteredPhotos.length;
      galleryGrid.innerHTML = '';

      if (filteredPhotos.length === 0) {
        galleryGrid.innerHTML = `
          <div class="col-span-full flex flex-col items-center justify-center py-16 text-center text-amber-100">
            <i class="fa-solid fa-images text-5xl mb-3 text-amber-200/50"></i>
            <p class="text-lg font-semibold text-amber-100">No hay fotos en esta vista</p>
            <p class="text-xs text-amber-200/70 mt-1">Prueba a cambiar los términos de búsqueda.</p>
          </div>
        `;
        return;
      }

      filteredPhotos.forEach((photo) => {
        const card = document.createElement('div');
        const rotation = photo.rotation !== undefined ? photo.rotation : getRandomRotation();
        
        card.className = 'polaroid-card group relative bg-[#fdfbf7] p-2.5 sm:p-4 pt-6 sm:pt-7 pb-4 sm:pb-6 rounded-sm border border-stone-200/70 cursor-pointer select-none';
        card.style.transform = `rotate(${rotation}deg)`;
        card.dataset.id = photo.id;

        card.innerHTML = `
          <!-- Chincheta superior -->
          <div class="pin"></div>

          <!-- Photo Container -->
          <div class="relative aspect-square w-full bg-stone-900 rounded-sm overflow-hidden photo-wrapper mb-3 sm:mb-4">
            <img src="${photo.url}" alt="${photo.caption || 'Polaroid'}" class="w-full h-full object-cover group-hover:scale-105 transition-transform duration-500 developing-animation" loading="lazy">
          </div>

          <!-- Handwritten Caption & Details -->
          <div class="px-1 text-center min-h-[65px] sm:min-h-[75px] flex flex-col justify-center items-center gap-0.5">
            <div class="caption-text font-handwriting text-lg sm:text-2xl text-stone-800 font-semibold leading-tight break-words">
              ${escapeHtml(photo.caption || '')}
            </div>
            ${photo.location ? `
              <div class="text-[10px] sm:text-[11px] font-medium text-stone-400 opacity-80 truncate max-w-full">
                <i class="fa-solid fa-location-dot text-rose-400"></i> ${escapeHtml(photo.location)}
              </div>
            ` : ''}
            ${photo.date ? `
              <div class="text-[10px] sm:text-[11px] font-medium text-stone-400 opacity-80">
                <i class="fa-regular fa-calendar"></i> ${formatDate(photo.date)}
              </div>
            ` : ''}
          </div>
        `;

        card.addEventListener('click', () => {
          openLightbox(photo.id);
        });

        galleryGrid.appendChild(card);
      });
    }

    function openLightbox(photoId) {
      const index = filteredPhotos.findIndex(p => p.id === photoId);
      if (index === -1) return;

      currentLightboxIndex = index;
      updateLightboxContent();

      modalLightbox.classList.remove('opacity-0', 'pointer-events-none');
      modalLightbox.querySelector('.modal-lightbox-card').classList.remove('scale-95');
      modalLightbox.querySelector('.modal-lightbox-card').classList.add('scale-100');
    }

    function updateLightboxContent() {
      const photo = filteredPhotos[currentLightboxIndex];
      if (!photo) return;

      // Escuchar cuando la imagen termine de cargar para calcular sus dimensiones reales
      lightboxImg.onload = function() {
        const isVertical = this.naturalHeight > this.naturalWidth;

        if (isVertical) {
          // Ajustes para foto vertical
          lightboxCard.classList.remove('max-w-3xl');
          lightboxCard.classList.add('max-w-md');

          lightboxWrapper.classList.remove('aspect-[4/3]');
          lightboxWrapper.classList.add('aspect-[3/4]');
        } else {
          // Ajustes para foto horizontal o cuadrada
          lightboxCard.classList.remove('max-w-md');
          lightboxCard.classList.add('max-w-3xl');

          lightboxWrapper.classList.remove('aspect-[3/4]');
          lightboxWrapper.classList.add('aspect-[4/3]');
        }
      };

      lightboxImg.src = photo.url;
      document.getElementById('lightbox-caption').textContent = photo.caption || '';
      
      const locEl = document.getElementById('lightbox-location');
      const dateEl = document.getElementById('lightbox-date');

      if (photo.location) {
        locEl.querySelector('span').textContent = photo.location;
        locEl.classList.remove('hidden');
      } else {
        locEl.classList.add('hidden');
      }

      if (photo.date) {
        dateEl.querySelector('span').textContent = formatDate(photo.date);
        dateEl.classList.remove('hidden');
      } else {
        dateEl.classList.add('hidden');
      }
    }

    function closeLightbox() {
      modalLightbox.classList.add('opacity-0', 'pointer-events-none');
      modalLightbox.querySelector('.modal-lightbox-card').classList.remove('scale-100');
      modalLightbox.querySelector('.modal-lightbox-card').classList.add('scale-95');
    }

    function escapeHtml(str) {
      return str.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;").replace(/'/g, "&#039;");
    }

    function formatDate(dateStr) {
      if (!dateStr) return '';
      try {
        const parts = dateStr.split('-');
        if (parts.length === 3) {
          const date = new Date(parts[0], parts[1] - 1, parts[2]);
          return date.toLocaleDateString('es-ES', { day: 'numeric', month: 'short', year: 'numeric' });
        }
        return dateStr;
      } catch (e) {
        return dateStr;
      }
    }

    function setupEventListeners() {
      inputSearch.addEventListener('input', (e) => {
        currentSearchTerm = e.target.value.trim();
        renderGallery();
      });

      document.getElementById('btn-close-lightbox').addEventListener('click', closeLightbox);
      
      document.getElementById('btn-prev-lightbox').addEventListener('click', () => {
        if (filteredPhotos.length === 0) return;
        currentLightboxIndex = (currentLightboxIndex - 1 + filteredPhotos.length) % filteredPhotos.length;
        updateLightboxContent();
      });

      document.getElementById('btn-next-lightbox').addEventListener('click', () => {
        if (filteredPhotos.length === 0) return;
        currentLightboxIndex = (currentLightboxIndex + 1) % filteredPhotos.length;
        updateLightboxContent();
      });

      window.addEventListener('keydown', (e) => {
        if (modalLightbox.classList.contains('opacity-0')) return;

        if (e.key === 'Escape') closeLightbox();
        if (e.key === 'ArrowLeft') document.getElementById('btn-prev-lightbox').click();
        if (e.key === 'ArrowRight') document.getElementById('btn-next-lightbox').click();
      });
    }
  </script>
</body>
</html>
