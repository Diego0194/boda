<!DOCTYPE html>
<html lang="es" class="h-full bg-stone-100">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Nuestra Luna de Miel 📸✨ | Álbum Polaroid</title>
  
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  
  <!-- Google Fonts: Caveat for handwriting, Plus Jakarta Sans for UI -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@500;600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  
  <!-- FontAwesome Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            handwriting: ['Caveat', 'cursive'],
            sans: ['Plus Jakarta Sans', 'sans-serif'],
          },
          colors: {
            polaroid: {
              paper: '#fcfbf9',
              shadow: 'rgba(0, 0, 0, 0.12)',
              accent: '#e07a5f',
            }
          }
        }
      }
    }
  </script>

  <style>
    /* Custom styles for organic textures & animations */
    body {
      background-color: #f5f2eb;
      background-image: radial-gradient(#e2dcd0 1px, transparent 1px);
      background-size: 24px 24px;
    }

    /* Wood / Warm Surface subtle texture overlay */
    .table-texture {
      box-shadow: inset 0 0 100px rgba(120, 80, 40, 0.05);
    }

    /* Polaroid Card Styling */
    .polaroid-card {
      background: #fdfbf7;
      box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.1), 0 8px 10px -6px rgba(0, 0, 0, 0.05);
      transition: all 0.35s cubic-bezier(0.25, 1, 0.5, 1);
      transform-origin: center center;
    }

    .polaroid-card:hover {
      transform: scale(1.04) rotate(0deg) !important;
      box-shadow: 0 20px 30px -10px rgba(0, 0, 0, 0.2), 0 12px 15px -8px rgba(0, 0, 0, 0.1);
      z-index: 30;
    }

    /* Soft Polaroid Photo Frame Inner Glow */
    .photo-wrapper {
      box-shadow: inset 0 0 6px rgba(0,0,0,0.15);
    }

    /* Photo Developing Animation Effect */
    @keyframes photoDevelop {
      0% {
        filter: brightness(0.2) contrast(0.5) sepia(0.8) blur(4px);
        opacity: 0.2;
      }
      50% {
        filter: brightness(0.7) contrast(0.8) sepia(0.3) blur(1px);
        opacity: 0.8;
      }
      100% {
        filter: brightness(1) contrast(1) sepia(0) blur(0px);
        opacity: 1;
      }
    }

    .developing-animation {
      animation: photoDevelop 2.2s cubic-bezier(0.4, 0, 0.2, 1) forwards;
    }

    /* Custom Scrollbar */
    ::-webkit-scrollbar {
      width: 8px;
    }
    ::-webkit-scrollbar-track {
      background: #f1ebd9;
    }
    ::-webkit-scrollbar-thumb {
      background: #d4c8b0;
      border-radius: 4px;
    }
    ::-webkit-scrollbar-thumb:hover {
      background: #b8a88c;
    }
  </style>
</head>
<body class="font-sans min-h-full flex flex-col text-stone-800 table-texture antialiased selection:bg-rose-200 selection:text-stone-900">

  <!-- Top Banner / Header -->
  <header class="sticky top-0 z-40 bg-white/80 backdrop-blur-md border-b border-stone-200/80 shadow-sm transition-all duration-300">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-3.5 flex flex-wrap items-center justify-between gap-4">
      
      <!-- Title & Subtitle -->
      <div class="flex items-center gap-3">
        <div class="w-10 h-10 rounded-full bg-rose-100 flex items-center justify-center text-rose-600 shadow-inner">
          <i class="fa-solid font-bold text-xl fa-heart"></i>
        </div>
        <div>
          <h1 class="text-2xl font-bold tracking-tight text-stone-900 flex items-center gap-2">
            Nuestra Luna de Miel <span class="text-rose-500 font-handwriting text-3xl font-normal">📸✨</span>
          </h1>
          <p class="text-xs text-stone-500 font-medium">Recuerdos inolvidables guardados estilo instantánea</p>
        </div>
      </div>

    </div>
  </header>

  <main class="flex-grow max-w-7xl w-full mx-auto px-4 sm:px-6 lg:px-8 py-8 flex flex-col gap-8">
    
    <!-- Controls Bar: Search & Tag Filters -->
    <section class="bg-white/60 backdrop-blur border border-stone-200/60 rounded-2xl p-4 shadow-sm flex flex-col md:flex-row items-center justify-between gap-4">
      
      <!-- Search Box -->
      <div class="relative w-full md:w-72">
        <i class="fa-solid fa-magnifying-glass absolute left-3.5 top-1/2 -translate-y-1/2 text-stone-400 text-sm"></i>
        <input type="text" id="input-search" placeholder="Buscar por lugar, nota o fecha..." class="w-full pl-10 pr-4 py-2 text-sm bg-stone-50 border border-stone-200 rounded-xl focus:outline-none focus:ring-2 focus:ring-rose-500/30 focus:border-rose-500 transition">
      </div>

      <!-- Tag Filter Pills -->
      <div class="flex items-center gap-1.5 overflow-x-auto w-full md:w-auto pb-1 md:pb-0 no-scrollbar" id="tag-filters-container">
        <!-- Dynamic Tag Pills injected via JS -->
      </div>

      <!-- Counter -->
      <div class="text-xs font-semibold text-stone-500 whitespace-nowrap bg-stone-100 px-3 py-1.5 rounded-lg">
        <span id="photo-counter">0</span> Fotografías
      </div>
    </section>

    <!-- Polaroid Gallery Grid -->
    <section id="gallery-grid" class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-8 sm:gap-10 py-4 items-start min-h-[350px]">
      <!-- Polaroid Items dynamically rendered here -->
    </section>

  </main>

  <!-- Modal: Lightbox / Enlarged View -->
  <div id="modal-lightbox" class="fixed inset-0 bg-stone-950/85 backdrop-blur-md z-50 flex items-center justify-center p-4 sm:p-8 opacity-0 pointer-events-none transition-all duration-300">
    
    <!-- Close Button -->
    <button id="btn-close-lightbox" class="absolute top-5 right-5 text-white/80 hover:text-white bg-white/10 hover:bg-white/20 rounded-full w-12 h-12 flex items-center justify-center transition z-10 text-xl backdrop-blur">
      <i class="fa-solid fa-xmark"></i>
    </button>

    <!-- Navigation Arrows -->
    <button id="btn-prev-lightbox" class="absolute left-4 top-1/2 -translate-y-1/2 text-white/80 hover:text-white bg-white/10 hover:bg-white/20 rounded-full w-12 h-12 flex items-center justify-center transition z-10 text-xl backdrop-blur">
      <i class="fa-solid fa-chevron-left"></i>
    </button>
    <button id="btn-next-lightbox" class="absolute right-4 top-1/2 -translate-y-1/2 text-white/80 hover:text-white bg-white/10 hover:bg-white/20 rounded-full w-12 h-12 flex items-center justify-center transition z-10 text-xl backdrop-blur">
      <i class="fa-solid fa-chevron-right"></i>
    </button>

    <!-- Giant Polaroid Frame Card -->
    <div class="relative bg-amber-50/95 max-w-3xl w-full rounded-lg shadow-2xl p-5 sm:p-8 flex flex-col items-center transform scale-95 transition-transform duration-300 modal-lightbox-card border border-stone-200">
      
      <!-- Photo Holder -->
      <div class="relative w-full aspect-[4/3] bg-stone-900 rounded shadow-inner overflow-hidden photo-wrapper flex items-center justify-center">
        <img id="lightbox-img" class="w-full h-full object-contain">
      </div>

      <!-- Caption & Metadata Area -->
      <div class="w-full pt-6 pb-2 text-center flex flex-col items-center">
        <p id="lightbox-caption" class="font-handwriting text-3xl sm:text-4xl text-stone-900 font-bold px-4 leading-tight mb-2">
          <!-- Caption -->
        </p>
        <div class="flex items-center gap-3 text-xs font-medium text-stone-500">
          <span id="lightbox-location" class="flex items-center gap-1 bg-stone-200/60 px-2.5 py-1 rounded-full"><i class="fa-solid fa-location-dot text-rose-500"></i> <span></span></span>
          <span id="lightbox-date" class="flex items-center gap-1 bg-stone-200/60 px-2.5 py-1 rounded-full"><i class="fa-regular fa-calendar"></i> <span></span></span>
        </div>
      </div>

    </div>
  </div>

  <script>
    // Configura aquí todas tus fotos
    const SAMPLE_PHOTOS = [
      {
        id: 'photo-1',
        url: 'honeymoon/foto1.jpg',
        caption: 'Primera noche ☂️',
        location: 'Omoide Yokocho, Tokyo',
        date: '2026-09-09',
        rotation: -2.5
      },
      {
        id: 'photo-2',
        url: 'honeymoon/foto2.jpg',
        caption: 'Volviendo a la infancia',
        location: 'Fan Fun Street, Tokyo',
        date: '2026-09-10',
        rotation: 1.8
      },
      {
        id: 'photo-3',
        url: 'honeymoon/foto3.jpg',
        caption: 'Pagodeando',
        location: 'Templo Senso-ji, Tokyo',
        date: '2026-09-10',
        rotation: 2.2
      },
      {
        id: 'photo-4',
        url: 'honeymoon/foto4.jpg',
        caption: '¿Me lo puedo llevar?',
        location: 'Pokémon Center Skytree, Tokyo',
        date: '2026-09-10',
        rotation: -1.2
      },
      {
        id: 'photo-5',
        url: 'honeymoon/foto5.jpg',
        caption: 'Ñaaam',
        location: 'Kukurihime Coffee, Tokyo',
        date: '2026-09-10',
        rotation: -0.7
      }
    ];

    let currentFilterTag = 'ALL';
    let currentSearchTerm = '';
    let currentLightboxIndex = -1;
    let filteredPhotos = [];

    // DOM Elements
    const galleryGrid = document.getElementById('gallery-grid');
    const photoCounter = document.getElementById('photo-counter');
    const tagFiltersContainer = document.getElementById('tag-filters-container');
    const inputSearch = document.getElementById('input-search');

    // Modal Lightbox
    const modalLightbox = document.getElementById('modal-lightbox');

    window.addEventListener('DOMContentLoaded', () => {
      setupEventListeners();
      renderGallery();
    });

    // Helper: Generate slight random rotation for natural polaroid look
    function getRandomRotation() {
      return (Math.random() * 6 - 3).toFixed(1);
    }

    function renderGallery() {
      // Filter Photos
      filteredPhotos = SAMPLE_PHOTOS.filter(p => {
        const matchesTag = currentFilterTag === 'ALL' || (p.location && p.location.trim().toLowerCase() === currentFilterTag.toLowerCase());
        const term = currentSearchTerm.toLowerCase();
        const matchesSearch = !term || 
          (p.caption && p.caption.toLowerCase().includes(term)) || 
          (p.location && p.location.toLowerCase().includes(term)) ||
          (p.date && p.date.includes(term));
        return matchesTag && matchesSearch;
      });

      // Ordenar por fecha: de más antiguas a más nuevas (ascendente)
      filteredPhotos.sort((a, b) => new Date(a.date || '9999-12-31') - new Date(b.date || '9999-12-31'));

      // Update counter
      photoCounter.textContent = filteredPhotos.length;

      // Render Tags Filter Bar
      renderTagFilters();

      // Clear Grid
      galleryGrid.innerHTML = '';

      if (filteredPhotos.length === 0) {
        galleryGrid.innerHTML = `
          <div class="col-span-full flex flex-col items-center justify-center py-16 text-center text-stone-400">
            <i class="fa-solid fa-images text-5xl mb-3 text-stone-300"></i>
            <p class="text-lg font-semibold text-stone-600">No hay fotos en esta vista</p>
            <p class="text-xs text-stone-400 mt-1">Prueba a cambiar los filtros de búsqueda.</p>
          </div>
        `;
        return;
      }

      // Render Polaroid Cards
      filteredPhotos.forEach((photo) => {
        const card = document.createElement('div');
        const rotation = photo.rotation !== undefined ? photo.rotation : getRandomRotation();
        
        card.className = 'polaroid-card group relative bg-[#fdfbf7] p-4 sm:p-4 pb-6 rounded-sm border border-stone-200/70 cursor-pointer select-none';
        card.style.transform = `rotate(${rotation}deg)`;
        card.dataset.id = photo.id;

        card.innerHTML = `
          <!-- Photo Container -->
          <div class="relative aspect-square w-full bg-stone-900 rounded-sm overflow-hidden photo-wrapper mb-4">
            <img src="${photo.url}" alt="${photo.caption || 'Polaroid'}" class="w-full h-full object-cover group-hover:scale-105 transition-transform duration-500 developing-animation" loading="lazy">
          </div>

          <!-- Handwritten Caption -->
          <div class="px-1 text-center min-h-[50px] flex flex-col justify-center">
            <div class="caption-text font-handwriting text-2xl text-stone-800 font-semibold leading-tight break-words">
              ${escapeHtml(photo.caption || '')}
            </div>
            
            <!-- Location & Date Tag -->
            <div class="mt-2 flex items-center justify-center gap-2 text-[11px] font-medium text-stone-400 opacity-80">
              ${photo.location ? `<span><i class="fa-solid fa-location-dot text-rose-400"></i> ${escapeHtml(photo.location)}</span>` : ''}
              ${photo.date ? `<span><i class="fa-regular fa-calendar"></i> ${formatDate(photo.date)}</span>` : ''}
            </div>
          </div>
        `;

        // Card Click opens Lightbox
        card.addEventListener('click', () => {
          openLightbox(photo.id);
        });

        galleryGrid.appendChild(card);
      });
    }

    // Render Filter Pills dynamically based on locations available
    function renderTagFilters() {
      const locations = Array.from(new Set(SAMPLE_PHOTOS.map(p => p.location).filter(Boolean)));
      
      let html = `
        <button class="tag-btn text-xs font-semibold px-3 py-1.5 rounded-xl transition ${currentFilterTag === 'ALL' ? 'bg-stone-900 text-white shadow-sm' : 'bg-stone-100 text-stone-600 hover:bg-stone-200'}" data-tag="ALL">
          Todas
        </button>
      `;

      locations.forEach(loc => {
        const active = currentFilterTag.toLowerCase() === loc.toLowerCase();
        html += `
          <button class="tag-btn text-xs font-semibold px-3 py-1.5 rounded-xl transition whitespace-nowrap ${active ? 'bg-rose-600 text-white shadow-sm' : 'bg-stone-100 text-stone-600 hover:bg-stone-200'}" data-tag="${escapeHtml(loc)}">
            📍 ${escapeHtml(loc)}
          </button>
        `;
      });

      tagFiltersContainer.innerHTML = html;

      // Add Tag Click Listeners
      tagFiltersContainer.querySelectorAll('.tag-btn').forEach(btn => {
        btn.addEventListener('click', () => {
          currentFilterTag = btn.dataset.tag;
          renderGallery();
        });
      });
    }

    function openLightbox(photoId) {
      const index = filteredPhotos.findIndex(p => p.id === photoId);
      if (index === -1) return;

      currentLightboxIndex = index;
      updateLightboxContent();

      modalLightbox.classList.remove('opacity-0', 'pointer-events-none');
      modalLightbox.querySelector('.modal-lightbox-card').classList.remove('scale-95');
      modalLightbox.querySelector('.modal-lightbox-card').classList.add('scale-100');
    }

    function updateLightboxContent() {
      const photo = filteredPhotos[currentLightboxIndex];
      if (!photo) return;

      document.getElementById('lightbox-img').src = photo.url;
      document.getElementById('lightbox-caption').textContent = photo.caption || '';
      
      const locEl = document.getElementById('lightbox-location');
      const dateEl = document.getElementById('lightbox-date');

      if (photo.location) {
        locEl.querySelector('span').textContent = photo.location;
        locEl.classList.remove('hidden');
      } else {
        locEl.classList.add('hidden');
      }

      if (photo.date) {
        dateEl.querySelector('span').textContent = formatDate(photo.date);
        dateEl.classList.remove('hidden');
      } else {
        dateEl.classList.add('hidden');
      }
    }

    function closeLightbox() {
      modalLightbox.classList.add('opacity-0', 'pointer-events-none');
      modalLightbox.querySelector('.modal-lightbox-card').classList.remove('scale-100');
      modalLightbox.querySelector('.modal-lightbox-card').classList.add('scale-95');
    }

    // Helper functions
    function escapeHtml(str) {
      return str.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;").replace(/'/g, "&#039;");
    }

    function formatDate(dateStr) {
      if (!dateStr) return '';
      try {
        const parts = dateStr.split('-');
        if (parts.length === 3) {
          const date = new Date(parts[0], parts[1] - 1, parts[2]);
          return date.toLocaleDateString('es-ES', { day: 'numeric', month: 'short', year: 'numeric' });
        }
        return dateStr;
      } catch (e) {
        return dateStr;
      }
    }

    function setupEventListeners() {
      // Search Input
      inputSearch.addEventListener('input', (e) => {
        currentSearchTerm = e.target.value.trim();
        renderGallery();
      });

      // Lightbox Controls
      document.getElementById('btn-close-lightbox').addEventListener('click', closeLightbox);
      
      document.getElementById('btn-prev-lightbox').addEventListener('click', () => {
        if (filteredPhotos.length === 0) return;
        currentLightboxIndex = (currentLightboxIndex - 1 + filteredPhotos.length) % filteredPhotos.length;
        updateLightboxContent();
      });

      document.getElementById('btn-next-lightbox').addEventListener('click', () => {
        if (filteredPhotos.length === 0) return;
        currentLightboxIndex = (currentLightboxIndex + 1) % filteredPhotos.length;
        updateLightboxContent();
      });

      // Keyboard Controls for Lightbox
      window.addEventListener('keydown', (e) => {
        if (modalLightbox.classList.contains('opacity-0')) return;

        if (e.key === 'Escape') closeLightbox();
        if (e.key === 'ArrowLeft') document.getElementById('btn-prev-lightbox').click();
        if (e.key === 'ArrowRight') document.getElementById('btn-next-lightbox').click();
      });
    }
  </script>
</body>
</html>
